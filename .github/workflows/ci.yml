name: CI

on:
  # Pull requests run CI; a push runs it only on main (the merge). Both triggers on every branch ran each PR commit twice:
  # 101 of 191 SHAs, and nine PRs queued for hours on 2026-11-17 (ROADMAP-3 96.5 C3).
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# A pull request that changes only documents (tools/ci-scope.py) runs Lint and the Documentation tests job, which runs the
# test modules in tests/doc_tests.json; the other jobs skip. A push to main always runs everything, so a document-reading
# test missing from the list still fails there (ROADMAP-3 96.5 C3). A branch rule may require any check name, so none may
# stop reporting: a single job skipped by `if` reports as skipped under its own name, but a matrix job skipped that way
# reports once under its unexpanded name, so the matrix job always runs and skips its steps instead. Each job that needs
# scope carries `!cancelled()`: a job whose `needs` failed is skipped, and skipped reads as passed, so a failed scope job
# would pass a pull request untested. With it, a failed scope job leaves docs_only empty and everything runs.
jobs:
  scope:
    name: Change scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2  # a pull request checks out its merge commit; HEAD^1 is the base it merges into
      - id: scope
        name: Documentation only?
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            changed="$(git diff --name-only --no-renames HEAD^1 HEAD)"
            printf '%s\n' "$changed"
            printf '%s\n' "$changed" | python3 tools/ci-scope.py | tee -a "$GITHUB_OUTPUT"
          else
            echo "docs_only=false" | tee -a "$GITHUB_OUTPUT"
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.17.5"
          args: check --output-format github

  docs:
    name: Documentation tests
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.docs_only == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bridgeforge
      - name: Run the tests that read documents
        run: python -m bridgeforge.test_guard -- python -m unittest $(python tools/ci-scope.py --doc-tests)

  lockfile:
    name: uv.lock in sync
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Check uv.lock matches pyproject.toml
        run: uv lock --check

  audit:
    name: Dependency audit
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - name: Audit runtime dependencies for known vulnerabilities
        run: |
          python -m pip install pip-audit .
          python -m pip_audit --local --skip-editable

  coverage:
    # The Ubuntu test shards run under coverage and upload their data; this job only combines it and applies the floor
    # (ROADMAP-3 96.5 C2: a separate full run under coverage took 5 minutes on top of the tests).
    name: Coverage (ubuntu / Python 3.15)
    needs: [scope, test]
    if: ${{ !cancelled() && needs.scope.outputs.docs_only != 'true' && needs.test.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bridgeforge
        with:
          install: 'coverage'
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: coverage-data-*
          path: ${{ runner.temp }}/coverage-parts
          merge-multiple: true
      - name: Combine the shards' data
        env:
          COVERAGE_FILE: ${{ runner.temp }}/coverage-data
        run: python -m coverage combine "${{ runner.temp }}/coverage-parts"
      - name: Report (fails below the pyproject floor)
        env:
          COVERAGE_FILE: ${{ runner.temp }}/coverage-data
        run: |
          python -m coverage report --sort=cover --format=markdown >> "$GITHUB_STEP_SUMMARY"
          python -m coverage report --format=total

  test:
    # Four shards per system, balanced by tests/module_timings.json (ROADMAP-3 96.5 C2): Windows fast alone took 9-11 minutes.
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }} / shard ${{ matrix.shard }} of 4
    needs: scope
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        shard: [1, 2, 3, 4]
        python-version: ["3.15"]
    steps:
      - name: Documentation-only pull request
        if: needs.scope.outputs.docs_only == 'true'
        run: echo "Only documents changed; the Documentation tests job runs the tests that read them."
      - uses: actions/checkout@v7
        if: needs.scope.outputs.docs_only != 'true'
      - uses: ./.github/actions/setup-bridgeforge
        if: needs.scope.outputs.docs_only != 'true'
        with:
          python-version: ${{ matrix.python-version }}
          install: ${{ matrix.os == 'ubuntu-latest' && '".[archives]" coverage "setuptools>=68"' || '. "setuptools>=68"' }}
      - name: Run shard ${{ matrix.shard }} of 4 under coverage
        if: needs.scope.outputs.docs_only != 'true' && matrix.os == 'ubuntu-latest'
        env:
          COVERAGE_FILE: ${{ runner.temp }}/coverage-data
        run: python -m bridgeforge.test_guard -- python -m coverage run -p -m tests.run_partitioned --shard ${{ matrix.shard }}/4 --timings "${{ runner.temp }}/test-timings-${{ matrix.shard }}.json"
      - name: Run shard ${{ matrix.shard }} of 4
        if: needs.scope.outputs.docs_only != 'true' && matrix.os != 'ubuntu-latest'
        run: python -m bridgeforge.test_guard -- python -m tests.run_partitioned --shard ${{ matrix.shard }}/4 --timings "${{ runner.temp }}/test-timings-${{ matrix.shard }}.json"
      - uses: actions/upload-artifact@v7.0.2
        if: needs.scope.outputs.docs_only != 'true' && matrix.os == 'ubuntu-latest'
        with:
          name: coverage-data-${{ matrix.shard }}
          path: ${{ runner.temp }}/coverage-data.*
          if-no-files-found: error
          retention-days: 3

  shared-fixtures:
    name: Shared fixtures match Project Go
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: Exxec/Project-Go
          ref: main
          path: project-go
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - name: Compare shared fixtures byte for byte
        env:
          PROJECT_GO_FIXTURES: ${{ github.workspace }}/project-go
        run: python -m unittest discover -s tests -p test_shared_fixtures.py -v
      - name: Import Project Go's actual coverage manifest (ROADMAP-3 80.9)
        env:
          PROJECT_GO_FIXTURES: ${{ github.workspace }}/project-go
        run: python -m unittest tests.test_go_coverage_manifest_contract -v
