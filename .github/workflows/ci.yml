name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          args: check --output-format github

  lockfile:
    name: uv.lock in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Check uv.lock matches pyproject.toml
        run: uv lock --check

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - name: Audit runtime dependencies for known vulnerabilities
        run: |
          python -m pip install pip-audit .
          python -m pip_audit --local --skip-editable

  coverage:
    name: Coverage (ubuntu / Python 3.15)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Bridgeforge (with the optional archive reader) and coverage
        run: python -m pip install ".[archives]" coverage
      - name: Run unit tests under coverage
        env:
          COVERAGE_FILE: ${{ runner.temp }}/.coverage
        run: python -m bridgeforge.test_guard -- python -m coverage run -m unittest discover -s tests
      - name: Report (fails below the pyproject floor)
        env:
          COVERAGE_FILE: ${{ runner.temp }}/.coverage
        run: |
          python -m coverage report --sort=cover --format=markdown >> "$GITHUB_STEP_SUMMARY"
          python -m coverage report --format=total

  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }} / ${{ matrix.partition }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        partition: [fast, slow]
        python-version: ["3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Bridgeforge
        run: python -m pip install .
      - name: Run ${{ matrix.partition }} unit tests
        run: python -m bridgeforge.test_guard -- python -m tests.run_partitioned --partition ${{ matrix.partition }} --timings "${{ runner.temp }}/test-timings-${{ matrix.partition }}.json"

  shared-fixtures:
    name: Shared fixtures match Project Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: Exxec/Project-Go
          ref: main
          path: project-go
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - name: Compare shared fixtures byte for byte
        env:
          PROJECT_GO_FIXTURES: ${{ github.workspace }}/project-go
        run: python -m unittest discover -s tests -p test_shared_fixtures.py -v
      - name: Import Project Go's actual coverage manifest (ROADMAP-3 80.9)
        env:
          PROJECT_GO_FIXTURES: ${{ github.workspace }}/project-go
        run: python -m unittest tests.test_go_coverage_manifest_contract -v
