name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/ruff-action@v3
        with:
          args: check --output-format github

  lockfile:
    name: uv.lock in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Check uv.lock matches pyproject.toml
        run: uv lock --check

  coverage:
    name: Coverage (ubuntu / Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Bridgeforge and coverage
        run: python -m pip install . coverage
      - name: Run unit tests under coverage
        env:
          COVERAGE_FILE: ${{ runner.temp }}/.coverage
        run: python -m bridgeforge.test_guard -- python -m coverage run -m unittest discover -s tests
      - name: Report (fails below the pyproject floor)
        env:
          COVERAGE_FILE: ${{ runner.temp }}/.coverage
        run: |
          python -m coverage report --sort=cover --format=markdown >> "$GITHUB_STEP_SUMMARY"
          python -m coverage report --format=total

  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Bridgeforge
        run: python -m pip install .
      - name: Run unit tests
        run: python -m bridgeforge.test_guard
