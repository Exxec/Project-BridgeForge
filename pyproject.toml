[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bridgeforge"
version = "0.2.0"
description = "Offline compatibility scanner for legacy Starsector mods"
requires-python = ">=3.10"
dependencies = ["psutil>=5.9"]

[project.scripts]
bridgeforge = "bridgeforge.cli:main"

[tool.setuptools.packages.find]
include = ["bridgeforge*"]

[tool.setuptools.package-data]
bridgeforge = ["release_policy.json", "dependency_successors.json", "vanilla_loose_scripts_rc8.json","java/*.java", "java-tools/bytecode/lib/*.jar", "rules/*.json", "packs/*/*.json", "compat_sets/*.json", "scenarios/*.json", "probe_profiles/*.txt"]

[tool.ruff]
target-version = "py310"
extend-exclude = ["probe-mod"]

[tool.ruff.lint]
# Pyflakes (unused/undefined names) plus syntax errors.
# One-line compound statements are house style, so the E7xx family stays off.
select = ["E9", "F"]

[tool.coverage.run]
branch = true
source = ["bridgeforge"]

[tool.coverage.report]
# A ratchet, not a target: raise it when coverage rises, never lower it to land a change.
fail_under = 78
skip_empty = true
