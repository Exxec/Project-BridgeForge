[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bridgeforge"
version = "0.2.0"
description = "Offline compatibility scanner for legacy Starsector mods"
requires-python = ">=3.10"
dependencies = ["psutil>=5.9"]

[project.scripts]
bridgeforge = "bridgeforge.cli:main"

[tool.setuptools.packages.find]
include = ["bridgeforge*"]

[tool.setuptools.package-data]
bridgeforge = ["java/*.java", "java-tools/bytecode/lib/*.jar", "rules/*.json", "packs/*/*.json", "compat_sets/*.json", "scenarios/*.json", "probe_profiles/*.txt"]
