[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bridgeforge"
version = "0.4.0"
description = "Offline compatibility scanner for legacy Starsector mods"
requires-python = ">=3.15"
dependencies = ["psutil>=5.9"]

[project.optional-dependencies]
# corpus-index reads .7z archives when this is installed; without it they are reported as not read.
archives = ["py7zr>=1.0"]

[project.scripts]
bridgeforge = "bridgeforge.cli:main"

[tool.setuptools.packages.find]
include = ["bridgeforge", "bridgeforge.*"]
namespaces = false

[tool.setuptools.package-data]
bridgeforge = ["release_policy.json", "dependency_successors.json", "automation_tiers.json", "vanilla_loose_scripts_rc8.json","java/*.java", "java-tools/bytecode/lib/*.jar", "rules/*.json", "packs/*/*.json", "compat_sets/*.json", "scenarios/*.json", "probe_profiles/*.txt", "kit_resources/*.ps1", "kit_resources/*.md"]

[tool.ruff]
target-version = "py315"
extend-exclude = ["probe-mod", "everything-claude-code"]

[tool.ruff.lint]
# Pyflakes (unused/undefined names) plus syntax errors.
# One-line compound statements are house style, so the E7xx family stays off.
select = ["E9", "F", "B"]
# Bugbear for real bug classes (mutable defaults, raise without `from`, blind assertRaises). Its style rules are off: B905 (zip strict),
# B007 (unused loop variable) and B009 (getattr with a constant) are house style, and B023 flags helper closures that are called inside
# the same loop iteration (all 10 hits on 2026-10-12 were such false positives). ROADMAP 70 H2.3.
ignore = ["B905", "B007", "B009", "B023"]

[tool.coverage.run]
branch = true
source = ["bridgeforge"]

[tool.coverage.report]
# A ratchet, not a target: raise it when coverage rises, never lower it to land a change.
fail_under = 80
skip_empty = true
